---

- name: Preparing VM
  gather_facts: true
  hosts: all
  remote_user: ubuntu
  become: true
  pre_tasks:
    - name: Validating the ssh port is open and
      wait_for:
        host: '{{ (ansible_ssh_host|default(ansible_host))|default(inventory_hostname) }}'
        port: 22
        delay: 5
        timeout: 300
        state: started
        search_regex: OpenSSH

  tasks:
    # - name: Wait until connection is ready
    #   ansible.builtin.wait_for_connection:
    #     timeout: 60
    - name: Install dependencies
      apt:
        name: "{{item}}"
        state: present
        update_cache: yes
      loop:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg-agent
      - software-properties-common
      - git
  
    - name: add GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: add docker repository to apt
      apt_repository:
        repo: deb https://download.docker.com/linux/ubuntu jammy stable
        state: present

    - name: install docker
      apt:
        name: "{{item}}"
        state: latest
        update_cache: yes
      loop:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    - name: check docker is active
      service:
        name: docker
        state: started
        enabled: yes
    - name: Ensure group "docker" exists
      ansible.builtin.group:
        name: docker
        state: present
    - name: adding ubuntu to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes
    - name: Install docker-compose
      get_url:
        url: https://github.com/docker/compose/releases/download/1.29.2/docker-compose-Linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: 'u+x,g+x'
    - name: Change file ownership, group and permissions
      ansible.builtin.file:
        path: /usr/local/bin/docker-compose
        owner: ubuntu
        group: ubuntu

    - name: Make config drectories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0766'
        owner: ubuntu
        group: docker
      loop:
      - /srv/prometheus/configuration/
      - /srv/prometheus/data/     
    - name: Make gfn config drectories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0766'
        owner: 472
        group: 472
      loop:
      - /srv/grafana/provisioning/
    - name: Copy prometeus conf to server
      ansible.builtin.template:
        src:  prometheus.yml.j2
        dest: /srv/prometheus/configuration/prometheus.yml
        mode: '0644'
        owner: nobody
        group: nogroup
    - name: Copy grafana conf to server
      ansible.builtin.template:
        src:  custom.ini.j2
        dest: /srv/grafana/custom.ini
        mode: '0644'
        owner: 472
        group: 472  
    - name: Copy docker-compose.yml to server
      ansible.builtin.copy:
        src: ./compose.yml
        dest: /srv/compose.yml
        mode: '0644'

    - name: Run Docker Compose (Up)
      community.docker.docker_compose_v2:
        project_name: monitoring
        project_src: /srv
        files:
          - compose.yml
        state: present
      register: output  
