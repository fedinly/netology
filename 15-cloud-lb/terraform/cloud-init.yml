#cloud-config
users:
  - name: ubuntu
    groups: sudo
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - ${ssh_public_key}
package_update: true
package_upgrade: false
packages:
  - apache2

write_files:
  - path: /var/www/html/index.html
    content: |
      <!DOCTYPE html>
      <html>
      <head>
          <title>Welcome</title>
      </head>
      <body>
          <h1>Hello from Yandex IG for Netology</h1>
          <p>This static page with cat from bucket:</p>
              <img src="https://storage.yandexcloud.net/${bucket}/${picture}">     
      </body>
      </html>
    permissions: '0644'

runcmd:
  - [ systemctl, restart, apache2 ]
