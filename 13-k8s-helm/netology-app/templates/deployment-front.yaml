apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
      - name: {{ .Values.image.frontend.name }}
        image: "{{ .Values.image.frontend.name }}:{{ .Values.image.frontend.tag }}"
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html-file # ПОДКЛЮЧЕНИЕ ConfigMap
          mountPath: /usr/share/nginx/html

      volumes:
      - name: html-file
        configMap:
          name: {{ .Values.configMap.name }}
