apiVersion: apps/v1
kind: Deployment
metadata:
  name: netology-app
  namespace: helm
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: netology-app
  template:
    metadata:
      labels:
        app: netology-app
    spec:
      containers:
      - name: {{ .Values.image.frontend.name }}
        image: "{{ .Values.image.frontend.name }}:{{ .Values.image.frontend.tag }}"
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html-file # ПОДКЛЮЧЕНИЕ ConfigMap
          mountPath: /usr/share/nginx/html
      
      volumes:
      - name: html-file
        configMap:
          name: web-content-01
