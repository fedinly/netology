kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: front-back-cache
  namespace: app-testpol-01

spec:
  policyTypes:
  - Ingress
  - Egress                 
  podSelector:
    matchLabels:
      app: backend
  ingress:
    - from:
      - podSelector:
          matchLabels:
            app: frontend
  egress:
    - to:
      - podSelector:
          matchLabels:
            app: cache
