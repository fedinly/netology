services:
  gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:8080"
    networks:
      - mon

  prometheus:
    image: prom/prometheus:latest
    user: root
    volumes:
      - ./prometheus/configuration/:/etc/prometheus/
      - ./prometheus/data/:/prometheus/
    container_name: prometheus
    hostname: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090
    restart: unless-stopped
    environment:
      TZ: "Europe/Moscow"
    networks:
      - mon

  grafana:
    image: docker.io/grafana/grafana-oss:12.3.2
    container_name: grafana
    user: root
    ports:
      - "8081:3000"
    depends_on:
      - prometheus
    volumes:
      - ./grafana:/var/lib/grafana
      - ./grafana/provisioning/:/etc/grafana/provisioning/
      - ./grafana/custom.ini:/etc/grafana/grafana.ini
    hostname: grafana
    restart: unless-stopped
    environment:
      TZ: "Asia/Barnaul"
    networks:
      - mon

networks:
  mon:
    name: microsvc_default
    external: true
