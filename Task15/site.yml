---
- name: Install Clickhouse
  tags: clickhouse
  hosts: clickhouse
  handlers:
    - name: Start clickhouse service
      become: true
      ansible.builtin.service:
        name: clickhouse-server
        state: restarted
  tasks:
    - block:
        - name: Get clickhouse distrib
          ansible.builtin.get_url:
            url: "https://packages.clickhouse.com/rpm/stable/{{ item }}-{{ clickhouse_version }}.x86_64.rpm"
            dest: "./{{ item }}-{{ clickhouse_version }}.rpm"
          with_items: "{{ clickhouse_packages }}"
      rescue:
        - name: Get clickhouse distrib
          ansible.builtin.get_url:
            url: "https://packages.clickhouse.com/rpm/stable/clickhouse-common-static-{{ clickhouse_version }}.x86_64.rpm"
            dest: "./clickhouse-common-static-{{ clickhouse_version }}.rpm"

    - name: Install clickhouse packages
      become: true
      ansible.builtin.dnf:
        name:
          - clickhouse-common-static-{{ clickhouse_version }}.rpm
          - clickhouse-client-{{ clickhouse_version }}.rpm
          - clickhouse-server-{{ clickhouse_version }}.rpm
        state: present
        disable_gpg_check: true

      notify: Start clickhouse service
    - name: Flush handlers
      meta: flush_handlers

    - name: Create database
      ansible.builtin.command: "clickhouse-client -q 'create database logs;'"
      register: create_db
      failed_when: create_db.rc != 0 and create_db.rc !=82
      changed_when: create_db.rc == 0

- name: Install vector
  tags: vector
  hosts: vector
  handlers:
    - name: Restart vector service
      become: true
      ansible.builtin.service:
        name: vector
        state: restarted
  # roles:
  #   - vector-role
  tasks:
    - name: Vector | Get vector distrib
      ansible.builtin.get_url:
        url: "https://yum.vector.dev/stable/vector-0/{{ vector_arch }}/{{ item }}-{{ vector_version }}-1.{{ vector_arch }}.rpm"
        dest: "./{{ item }}-{{ vector_version }}-1.{{ vector_arch }}.rpm"
      with_items: "{{ vector_packages }}"
    # - name: Import Vector GPG key
    #   ansible.builtin.rpm_key:
    #     state: present
    #     key: "https://repositories.timber.io/public/vector/gpg.3543DB2D0A2BC4B8.key"
    #     fingerprint: "1e46 c153 e9ef a240 18c3 6f75 3543 db2d 0a2b c4b8"
    #     become: yes
    - name: Vector | Install packages
      become: true
      ansible.builtin.dnf:
        name:
          - vector-{{ vector_version }}-1.{{ vector_arch }}.rpm
        state: present
        disable_gpg_check: true
    - name: Vector | Install config
      become: true
      template:
        src: vector.yml.j2
        dest: vector.yml
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_group_id }}"
        mode: '0644'
        validate: 
    - name: Vector | Install service
      become: true
      template:
        src: vector.service.j2
        dest: /etc/systemd/system/vector.service
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_group_id }}"
        mode: '0644'
    #   notify: Restart vector service
    # - name: Flush handlers
    #   meta: flush_handlers
    - name: Vector | Start service
      become: true
      ansible.builtin.systemd:
        name: vector
        state: started
        daemon_reload: true
        masked: no

- name: Install Nginx
  tags: nginx
  hosts: lighthouse
  handlers:
    - name: start-nginx
      become: true
      command: nginx
    - name: reload-nginx
      become: true
      command: nginx -s reload
  tasks: 
    - name: NGINX | Install epel
      become: true
      ansible.builtin.dnf:
        name: epel-release
        state: present
    - name: NGINX | Install nginx
      become: true
      ansible.builtin.dnf:
        name: nginx
        state: present
      notify: start-nginx
    - name: NGINX | Generate general config
      become: true
      template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        mode: 0664
      notify: reload-nginx

- name: Install lighthouse
  tags: lighthouse
  hosts: lighthouse
  handlers:
    - name: reload-nginx
      become: true
      command: nginx -s reload
  pre_tasks:
    - name: lighthouse | Install dependencies
      become: true
      ansible.builtin.dnf:
        name: git
        state: present
  tasks:
    - name: Lighthouse | copy from git
      become: true
      git:
        repo: "{{ lighthouse_vcs }}"
        version: master
        dest: "{{ lighthouse_dir }}"
    - name: Lighthouse | create lighthouse config
      become: true
      template:
        src: templates/lighthouse.conf.j2
        dest: /etc/nginx/conf.d/default.conf
        mode: 0664
      notify: reload-nginx
