---
# tasks file for nginx-role
- name: NGINX | Install epel
  become: true
  ansible.builtin.dnf:
    name: epel-release
    state: present
- name: NGINX | Install nginx
  become: true
  ansible.builtin.dnf:
    name: nginx
    state: present
  notify: start-nginx
- name: NGINX | Generate general config
  become: true
  template:
    src: templates/nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: 0664
  notify: reload-nginx